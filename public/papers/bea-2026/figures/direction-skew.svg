<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, sans-serif">
  <style>
    .label    { fill: currentColor; font-size: 13px; font-weight: 500; }
    .sub      { fill: currentColor; font-size: 11px; opacity: 0.7; }
    .bignum   { fill: currentColor; font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .bar-ins  { fill: #b3261e; }
    .bar-del  { fill: #b3261e; opacity: 0.35; }
    .ratio    { fill: #b3261e; font-size: 22px; font-weight: 600; }
    .axis     { stroke: currentColor; stroke-width: 1; opacity: 0.3; }
    @media (prefers-color-scheme: dark) {
      .bar-ins { fill: #e87c75; }
      .bar-del { fill: #e87c75; opacity: 0.35; }
      .ratio { fill: #e87c75; }
    }
  </style>

  <!-- left panel: the bars -->
  <g transform="translate(60, 40)">
    <text class="label" x="0" y="0">Comma errors generated by SyntErr</text>

    <!-- Insertion bar -->
    <text class="sub" x="0" y="48">Insertion</text>
    <rect class="bar-ins" x="0" y="58" width="360" height="36" rx="2" />
    <text class="bignum" x="370" y="86">78%</text>

    <!-- Deletion bar -->
    <text class="sub" x="0" y="138">Deletion</text>
    <rect class="bar-del" x="0" y="148" width="100" height="36" rx="2" />
    <text class="bignum" x="110" y="176" style="opacity: 0.7;">22%</text>

    <text class="sub" x="0" y="226">SyntErr generates 3.6× more comma insertions than deletions.</text>
    <text class="sub" x="0" y="244">Models trained on this learn to preserve commas, not remove them.</text>
  </g>

  <!-- right panel: the ratio callout -->
  <g transform="translate(560, 40)">
    <line class="axis" x1="0" y1="20" x2="0" y2="200" />
    <text class="ratio" x="20" y="100">3.6×</text>
    <text class="sub"   x="20" y="125">directional</text>
    <text class="sub"   x="20" y="142">skew</text>
  </g>
</svg>
