<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, sans-serif">
  <style>
    .axis     { stroke: currentColor; stroke-width: 1; opacity: 0.4; }
    .grid     { stroke: currentColor; stroke-width: 0.5; opacity: 0.15; }
    .tick     { fill: currentColor; opacity: 0.6; font-size: 11px; }
    .label    { fill: currentColor; font-size: 13px; font-weight: 500; }
    .line-up  { stroke: #6b6b6b; stroke-width: 2.5; fill: none; opacity: 0.55; stroke-linecap: round; stroke-linejoin: round; }
    .line-down{ stroke: #b3261e; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .dot-up   { fill: #6b6b6b; opacity: 0.55; }
    .dot-down { fill: #b3261e; }
    .annot    { fill: currentColor; font-size: 12px; opacity: 0.85; }
    .annot-em { fill: #b3261e; font-size: 12px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .line-down { stroke: #e87c75; }
      .dot-down { fill: #e87c75; }
      .annot-em { fill: #e87c75; }
    }
  </style>

  <!-- frame -->
  <line class="axis" x1="80" y1="40" x2="80" y2="300" />
  <line class="axis" x1="80" y1="300" x2="640" y2="300" />

  <!-- y-axis ticks -->
  <text class="tick" text-anchor="end" x="72" y="304">0</text>
  <text class="tick" text-anchor="end" x="72" y="244">25</text>
  <text class="tick" text-anchor="end" x="72" y="184">50</text>
  <text class="tick" text-anchor="end" x="72" y="124">75</text>
  <text class="tick" text-anchor="end" x="72" y="64">100</text>
  <line class="grid" x1="80" y1="60" x2="640" y2="60" />
  <line class="grid" x1="80" y1="120" x2="640" y2="120" />
  <line class="grid" x1="80" y1="180" x2="640" y2="180" />
  <line class="grid" x1="80" y1="240" x2="640" y2="240" />

  <!-- x-axis ticks (model size, 8 conditions) -->
  <text class="tick" text-anchor="middle" x="120" y="320">0.8B</text>
  <text class="tick" text-anchor="middle" x="200" y="320">1B</text>
  <text class="tick" text-anchor="middle" x="280" y="320">3B</text>
  <text class="tick" text-anchor="middle" x="360" y="320">4B</text>
  <text class="tick" text-anchor="middle" x="440" y="320">7B</text>
  <text class="tick" text-anchor="middle" x="520" y="320">8B</text>
  <text class="tick" text-anchor="middle" x="600" y="320">12B</text>

  <!-- Aggregate F0.5 (rises with finetune) -->
  <polyline class="line-up"
    points="120,210 200,195 280,180 360,160 440,140 520,125 600,108" />
  <circle class="dot-up" cx="120" cy="210" r="4"/>
  <circle class="dot-up" cx="200" cy="195" r="4"/>
  <circle class="dot-up" cx="280" cy="180" r="4"/>
  <circle class="dot-up" cx="360" cy="160" r="4"/>
  <circle class="dot-up" cx="440" cy="140" r="4"/>
  <circle class="dot-up" cx="520" cy="125" r="4"/>
  <circle class="dot-up" cx="600" cy="108" r="4"/>

  <!-- Subordinate-clause comma rule (collapses) -->
  <polyline class="line-down"
    points="120,265 200,272 280,278 360,283 440,288 520,292 600,295" />
  <circle class="dot-down" cx="120" cy="265" r="4"/>
  <circle class="dot-down" cx="200" cy="272" r="4"/>
  <circle class="dot-down" cx="280" cy="278" r="4"/>
  <circle class="dot-down" cx="360" cy="283" r="4"/>
  <circle class="dot-down" cx="440" cy="288" r="4"/>
  <circle class="dot-down" cx="520" cy="292" r="4"/>
  <circle class="dot-down" cx="600" cy="295" r="4"/>

  <!-- inline labels -->
  <text class="annot" x="610" y="103">Aggregate F<tspan baseline-shift="sub" font-size="9">0.5</tspan></text>
  <text class="annot-em" x="610" y="298">Subordinate comma rule</text>

  <!-- y-axis title -->
  <text class="label" transform="translate(20, 200) rotate(-90)" text-anchor="middle">Score (%)</text>

  <!-- x-axis title -->
  <text class="label" text-anchor="middle" x="360" y="346">Model parameters</text>
</svg>
