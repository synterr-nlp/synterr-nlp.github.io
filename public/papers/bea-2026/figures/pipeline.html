<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Rule-Application Pipeline — Diagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink:        #1d2330;
    --ink-soft:   #4a5468;
    --rule:       #c9cfd9;
    --paper:      #fbfaf7;

    /* publication-muted palette */
    --c-source-fill:  #e6efe2;   --c-source-stroke:  #6a8d62;
    --c-process-fill: #e6ecf3;   --c-process-stroke: #4d6a8c;
    --c-token-fill:   #fbeec9;   --c-token-stroke:   #b58a2b;
    --c-apply-fill:   #fde3c0;   --c-apply-stroke:   #c47a2a;
    --c-rule-fill:    #cfe7e4;   --c-rule-stroke:    #3f8a82;
    --c-out-fill:     #ecd7df;   --c-out-stroke:     #9a4a66;
    --c-config-fill:  #e7dff0;   --c-config-stroke:  #6c5494;
  }

  html, body { background: #ececea; margin: 0; padding: 0; color: var(--ink); }
  body {
    font-family: "Source Sans 3", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "ss01", "cv11";
  }

  .page {
    width: 1123px;          /* A4 landscape @ 96 dpi */
    height: 794px;
    margin: 24px auto;
    background: var(--paper);
    box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 18px 40px -18px rgba(20,30,50,.18);
    position: relative;
    padding: 56px 64px 48px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }

  header.doc {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 14px;
    margin-bottom: 18px;
  }
  header.doc .eyebrow {
    font-family: "JetBrains Mono", monospace;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  header.doc h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }
  header.doc .meta {
    font-family: "JetBrains Mono", monospace;
    font-size: 10.5px;
    color: var(--ink-soft);
    text-align: right;
    line-height: 1.5;
  }

  .canvas {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg.diagram { width: 100%; height: auto; display: block; }

  /* SVG typography */
  .label-box   { font-family: "Source Sans 3", sans-serif; font-weight: 600; font-size: 15px; fill: var(--ink); dominant-baseline: middle; }
  .label-box.sm{ font-size: 13.5px; }
  .label-arrow { font-family: "JetBrains Mono", monospace; font-weight: 400; font-size: 11px; fill: var(--ink-soft); letter-spacing: 0.01em; dominant-baseline: middle; }
  .label-arrow .em { fill: var(--ink); }
  .shape       { stroke-width: 1.4; filter: url(#boxshadow); }
  .shape-accent{ stroke-width: 1.4; }
  .edge        { fill: none; stroke: #2a313e; stroke-width: 1.3; }
  .edge-dashed { fill: none; stroke: #2a313e; stroke-width: 1.3; stroke-dasharray: 4 3; }
  .or          { font-family: "JetBrains Mono", monospace; font-size: 11px; fill: var(--ink-soft); letter-spacing: 0.08em; }

  /* legend */
  footer.doc {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--rule);
    font-family: "JetBrains Mono", monospace;
    font-size: 10.5px;
    color: var(--ink-soft);
  }
  .legend { display: flex; gap: 22px; flex-wrap: wrap; align-items: center; }
  .legend .item { display: flex; align-items: center; gap: 8px; }
  .legend svg { display: block; }
  .pagenum { letter-spacing: 0.14em; text-transform: uppercase; }

  @media print {
    html, body { background: white; }
    .page { margin: 0; box-shadow: none; width: 100%; height: 100vh; }
    @page { size: A4 landscape; margin: 0; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="doc">
    <div>
      <div class="eyebrow">Figure 1 · Synthetic error-generation pipeline</div>
      <h1>Rule application over dependency-parsed sentences</h1>
    </div>
    <div class="meta">
      v 1.0 &nbsp;·&nbsp; 2026-05-11<br/>
      shapes: <span style="color:var(--ink)">▱</span> data &nbsp; <span style="color:var(--ink)">▭</span> process
    </div>
  </header>

  <div class="canvas">
    <!-- viewBox sized to give clean numeric coordinates -->
    <svg class="diagram" viewBox="0 0 1100 430" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- arrowhead -->
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#2a313e"/>
        </marker>
        <filter id="boxshadow" x="-10%" y="-20%" width="130%" height="160%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="0.9"/>
          <feOffset dx="0" dy="1.2" result="o"/>
          <feComponentTransfer in="o" result="s">
            <feFuncA type="linear" slope="0.28"/>
          </feComponentTransfer>
          <feMerge>
            <feMergeNode in="s"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <!-- subtle inner shading for "process box" 3D feel from original -->
        <linearGradient id="processStripe" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0"   stop-color="#ffffff" stop-opacity="0"/>
          <stop offset="0.06" stop-color="#000000" stop-opacity="0.06"/>
          <stop offset="0.10" stop-color="#000000" stop-opacity="0"/>
          <stop offset="0.90" stop-color="#000000" stop-opacity="0"/>
          <stop offset="0.94" stop-color="#000000" stop-opacity="0.06"/>
          <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
      </defs>

      <!-- ============================================================
           LAYOUT  (all coords in viewBox units)
           Top row  y-center = 90
           Bot row  y-center = 380
           Columns: col1 90, col2 280, col3 470, col4 660, col5 850
           Box sizes: data parallelograms ≈ 150 x 70, processes ≈ 150 x 70
         ============================================================ -->

      <!-- ============ TOP ROW ============ -->

      <!-- Clean Sentences (data, parallelogram) -->
      <g>
        <path d="M30,60 L180,60 L160,120 L10,120 Z"
              class="shape" fill="var(--c-source-fill)" stroke="var(--c-source-stroke)"/>
        <text class="label-box" x="95" y="82" text-anchor="middle">Clean</text>
        <text class="label-box" x="95" y="100" text-anchor="middle">sentences</text>
      </g>

      <!-- Stanza (process) -->
      <g>
        <rect x="225" y="60" width="150" height="60" rx="2"
              class="shape" fill="var(--c-process-fill)" stroke="var(--c-process-stroke)"/>
        <line x1="235" y1="60" x2="235" y2="120" stroke="var(--c-process-stroke)" stroke-width="1.1"/>
        <line x1="365" y1="60" x2="365" y2="120" stroke="var(--c-process-stroke)" stroke-width="1.1"/>
        <text class="label-box" x="300" y="90" text-anchor="middle">Stanza</text>
      </g>

      <!-- AnalyzedToken (data, parallelogram) -->
      <g>
        <path d="M495,60 L645,60 L625,120 L475,120 Z"
              class="shape" fill="var(--c-token-fill)" stroke="var(--c-token-stroke)"/>
        <text class="label-box" x="560" y="90" text-anchor="middle">AnalyzedToken</text>
      </g>

      <!-- edges top row -->
      <!-- Clean → Stanza -->
      <line class="edge" x1="170" y1="90" x2="225" y2="90" marker-end="url(#arrow)"/>

      <!-- Stanza → AnalyzedToken : two parallel labelled edges (POS / depparse) -->
      <!-- POS arrow (upper) -->
      <path class="edge" d="M375,78 L489,78" marker-end="url(#arrow)"/>
      <text class="label-arrow" x="432" y="70" text-anchor="middle">
        <tspan class="em">POS</tspan>
      </text>
      <!-- depparse arrow (lower) -->
      <path class="edge" d="M375,102 L481,102" marker-end="url(#arrow)"/>
      <text class="label-arrow" x="428" y="118" text-anchor="middle">
        <tspan class="em">depparse tree</tspan>
      </text>

      <!-- ============ BOTTOM ROW ============ -->

      <!-- Reference Dataset (data, parallelogram) -->
      <g>
        <path d="M30,220 L180,220 L160,280 L10,280 Z"
              class="shape" fill="var(--c-config-fill)" stroke="var(--c-config-stroke)"/>
        <text class="label-box sm" x="95" y="242" text-anchor="middle">Reference</text>
        <text class="label-box sm" x="95" y="258" text-anchor="middle">dataset</text>
      </g>

      <!-- OR divider -->
      <text class="or" x="95" y="320" text-anchor="middle">OR</text>

      <!-- Config File (data, parallelogram) -->
      <g>
        <path d="M30,340 L180,340 L160,400 L10,400 Z"
              class="shape" fill="var(--c-config-fill)" stroke="var(--c-config-stroke)"/>
        <text class="label-box sm" x="95" y="362" text-anchor="middle">Config</text>
        <text class="label-box sm" x="95" y="378" text-anchor="middle">file</text>
      </g>

      <!-- Calculate Error Distribution (process) -->
      <g>
        <rect x="225" y="280" width="170" height="80" rx="2"
              class="shape" fill="#ffffff" stroke="#5b6577"/>
        <text class="label-box sm" x="310" y="304" text-anchor="middle">Calculate</text>
        <text class="label-box sm" x="310" y="320" text-anchor="middle">error</text>
        <text class="label-box sm" x="310" y="336" text-anchor="middle">distribution</text>
      </g>

      <!-- Can_apply (process, highlighted because it's the gate) -->
      <g>
        <rect x="475" y="280" width="170" height="80" rx="2"
              class="shape" fill="var(--c-apply-fill)" stroke="var(--c-apply-stroke)"/>
        <line x1="485" y1="280" x2="485" y2="360" stroke="var(--c-apply-stroke)" stroke-width="1.1"/>
        <line x1="635" y1="280" x2="635" y2="360" stroke="var(--c-apply-stroke)" stroke-width="1.1"/>
        <text class="label-box" x="560" y="313" text-anchor="middle">Applicability</text>
        <text class="label-box" x="560" y="331" text-anchor="middle">check</text>
      </g>

      <!-- Apply rule (process) -->
      <g>
        <rect x="710" y="280" width="150" height="80" rx="2"
              class="shape" fill="var(--c-rule-fill)" stroke="var(--c-rule-stroke)"/>
        <line x1="720" y1="280" x2="720" y2="360" stroke="var(--c-rule-stroke)" stroke-width="1.1"/>
        <line x1="850" y1="280" x2="850" y2="360" stroke="var(--c-rule-stroke)" stroke-width="1.1"/>
        <text class="label-box" x="785" y="320" text-anchor="middle">Apply rule</text>
      </g>

      <!-- Output (data, parallelogram) -->
      <g>
        <path d="M935,290 L1085,290 L1065,350 L915,350 Z"
              class="shape" fill="var(--c-out-fill)" stroke="var(--c-out-stroke)"/>
        <text class="label-arrow" x="1000" y="312" text-anchor="middle" style="font-size:13.5px; fill: var(--ink); font-weight:500;">(src, tgt,</text>
        <text class="label-arrow" x="1000" y="328" text-anchor="middle" style="font-size:13.5px; fill: var(--ink); font-weight:500;">rule)</text>
      </g>

      <!-- bottom-row edges -->
      <!-- Reference dataset → Calculate (diagonal up) -->
      <path class="edge" d="M170,250 C200,250 205,320 225,320" marker-end="url(#arrow)"/>
      <!-- Config file → Calculate (diagonal down) -->
      <path class="edge" d="M170,370 C200,370 205,320 225,320" marker-end="url(#arrow)"/>

      <!-- Calculate → Can_apply  with "choice of error type" -->
      <line class="edge" x1="395" y1="320" x2="475" y2="320" marker-end="url(#arrow)"/>
      <text class="label-arrow" x="433" y="310" text-anchor="middle">choice of</text>
      <text class="label-arrow" x="433" y="340" text-anchor="middle">error type</text>

      <!-- Can_apply → Apply rule -->
      <!-- Applicability check → Apply rule -->
      <line class="edge" x1="645" y1="320" x2="710" y2="320" marker-end="url(#arrow)"/>
      <text class="label-arrow" x="677" y="310" text-anchor="middle">matched</text>
      <text class="label-arrow" x="677" y="334" text-anchor="middle">rule</text>

      <!-- Apply rule → Output -->
      <line class="edge" x1="860" y1="320" x2="925" y2="320" marker-end="url(#arrow)"/>

      <!-- AnalyzedToken → Can_apply (vertical, with "choice of index") -->
      <line class="edge" x1="560" y1="120" x2="560" y2="280" marker-end="url(#arrow)"/>
      <text class="label-arrow" x="572" y="190" text-anchor="start">choice of</text>
      <text class="label-arrow" x="572" y="204" text-anchor="start">index</text>

    </svg>
  </div>

  <footer class="doc">
    <div class="legend">
      <div class="item">
        <svg width="22" height="14" viewBox="0 0 22 14"><path d="M3,1 L21,1 L19,13 L1,13 Z" fill="var(--c-source-fill)" stroke="var(--c-source-stroke)" stroke-width="1.2"/></svg>
        input data
      </div>
      <div class="item">
        <svg width="22" height="14" viewBox="0 0 22 14"><rect x="1" y="1" width="20" height="12" fill="var(--c-process-fill)" stroke="var(--c-process-stroke)" stroke-width="1.2"/></svg>
        process
      </div>
      <div class="item">
        <svg width="22" height="14" viewBox="0 0 22 14"><rect x="1" y="1" width="20" height="12" fill="var(--c-apply-fill)" stroke="var(--c-apply-stroke)" stroke-width="1.2"/></svg>
        gate / decision
      </div>
      <div class="item">
        <svg width="22" height="14" viewBox="0 0 22 14"><path d="M3,1 L21,1 L19,13 L1,13 Z" fill="var(--c-out-fill)" stroke="var(--c-out-stroke)" stroke-width="1.2"/></svg>
        output tuple
      </div>
    </div>
    <div class="pagenum">Fig. 1 — pipeline / 1 of 1</div>
  </footer>
</div>
</body>
</html>
